# No secrets here: every credential comes from environment variables.
# Local target = DuckDB file (no account needed); snowflake target = your warehouse.
memory_shortage:
  target: "{{ env_var('DBT_TARGET', 'local') }}"
  outputs:
    local:
      type: duckdb
      path: "{{ env_var('DBT_DUCKDB_PATH', '../warehouse/local.duckdb') }}"
      schema: main
      threads: 4
    snowflake:
      type: snowflake
      account: "{{ env_var('SNOWFLAKE_ACCOUNT', '') }}"
      user: "{{ env_var('SNOWFLAKE_USER', '') }}"
      private_key_path: "{{ env_var('SNOWFLAKE_PRIVATE_KEY_PATH', '') }}"
      role: "{{ env_var('SNOWFLAKE_ROLE', 'SHORTAGE_TRANSFORMER') }}"
      warehouse: "{{ env_var('SNOWFLAKE_WAREHOUSE', 'SHORTAGE_WH') }}"
      database: "{{ env_var('SNOWFLAKE_DATABASE', 'MEMORY_SHORTAGE') }}"
      schema: STAGING
      threads: 4
      client_session_keep_alive: false
